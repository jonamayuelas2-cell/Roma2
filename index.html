<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roma Eterna — Tu Guía de Viaje a la Ciudad Eterna</title>
  <meta name="description" content="Descubre los mejores lugares de Roma: monumentos, museos, restaurantes, barrios y parques. Con mapa interactivo y pronóstico del tiempo en tiempo real.">
  <meta name="theme-color" content="#d4af37">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Roma Eterna">
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph -->
  <meta property="og:title" content="Roma Eterna — Guía de Viaje">
  <meta property="og:description" content="Tu guía definitiva para descubrir los tesoros de la Ciudad Eterna">
  <meta property="og:type" content="website">

  <!-- Leaflet (mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Estilos propios -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ══ HEADER ══════════════════════════════════════════ -->
  <header>
    <div class="header-inner">
      <a class="logo" href="#">
        <span class="logo-icon">🏛️</span>
        <span class="logo-text">Roma Eterna<span class="logo-sub">La Ciudad Eterna · Guía de Viaje</span></span>
      </a>
      <nav class="main-tabs">
        <button class="tab-btn active" data-tab="lugares" id="tab-lugares">
          <span class="tab-icon">🗺️</span> <span>Lugares</span>
        </button>
        <button class="tab-btn" data-tab="meteo" id="tab-meteo">
          <span class="tab-icon">🌤️</span> <span>Tiempo</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- ══ HERO ════════════════════════════════════════════ -->
  <section class="hero">
    <h1>🇮🇹 Descubre Roma</h1>
    <p>20 lugares imprescindibles para vivir la Ciudad Eterna</p>
  </section>

  <!-- ══ FILTROS ══════════════════════════════════════════ -->
  <section class="filters-bar" id="filters-bar">
    <div class="filters-inner">
      <!-- Búsqueda -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="search" id="search-input" placeholder="Buscar lugares, tipos, tags..." autocomplete="off">
      </div>

      <!-- Filtros por tipo -->
      <div class="type-filters">
        <button class="filter-chip active" data-type="todos">✨ Todos</button>
        <button class="filter-chip" data-type="cultura">🏛️ Cultura</button>
        <button class="filter-chip" data-type="museos">🖼️ Museos</button>
        <button class="filter-chip" data-type="restaurantes">🍝 Restaurantes</button>
        <button class="filter-chip" data-type="barrios">🏘️ Barrios</button>
        <button class="filter-chip" data-type="parques">🌿 Parques</button>
        <button class="filter-chip" data-type="mercados">🛍️ Mercados</button>
        <button class="filter-chip" data-type="cafes">☕ Cafés</button>
      </div>

      <!-- Toggles de vista -->
      <div class="view-toggles">
        <button class="view-btn active" data-view="cards" title="Vista tarjetas" id="view-cards">⊞</button>
        <button class="view-btn" data-view="list" title="Vista lista" id="view-list">≡</button>
        <button class="view-btn" data-view="map" title="Vista mapa" id="view-map">🗺</button>
      </div>
    </div>
    <div class="results-info" id="results-count"></div>
  </section>

  <!-- ══ SECCIÓN LUGARES ═══════════════════════════════════ -->
  <section id="lugares-section">
    <main>
      <div id="places-container"></div>
    </main>
  </section>

  <!-- ══ SECCIÓN TIEMPO ════════════════════════════════════ -->
  <section id="weather-section" style="display:none">
    <main>
      <div id="weather-container">
        <div class="loading"><div class="spinner"></div> Cargando meteorología...</div>
      </div>
    </main>
  </section>

  <!-- ══ SCRIPT PRINCIPAL ══════════════════════════════════ -->
  <script src="app.js"></script>
</body>
</html>
