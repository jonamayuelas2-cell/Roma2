<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Nopal - Restaurante Mexicano</title>
  <meta name="description" content="Casa Nopal es una web de restaurante mexicano con carta, platos destacados, mapa, horarios, reservas y clima para disfrutar la terraza.">
  <meta name="theme-color" content="#0f5f3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Casa Nopal">
  <link rel="manifest" href="manifest.json">

  <meta property="og:title" content="Casa Nopal - Restaurante Mexicano">
  <meta property="og:description" content="Tacos, moles, antojitos, margaritas y postres mexicanos en un local vivo y contemporaneo.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo" href="#">
        <span class="logo-icon">CN</span>
        <span class="logo-text">Casa Nopal<span class="logo-sub">Taqueria y cocina mexicana</span></span>
      </a>
      <nav class="main-tabs">
        <button class="tab-btn active" data-tab="lugares" id="tab-lugares">
          <span class="tab-icon">Menu</span>
        </button>
        <button class="tab-btn" data-tab="meteo" id="tab-meteo">
          <span class="tab-icon">Terraza</span>
        </button>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero-copy">
      <p class="eyebrow">Madrid · Cocina mexicana hecha a fuego lento</p>
      <h1>Casa Nopal</h1>
      <p>Sabores de mercado, maiz nixtamalizado y cocteles frescos para comer sin prisa.</p>
      <div class="hero-actions">
        <a class="btn-primary hero-btn" href="tel:+34910000000">Reservar mesa</a>
        <a class="btn-secondary hero-btn" href="#places-container">Ver carta</a>
      </div>
    </div>
  </section>

  <section class="filters-bar" id="filters-bar">
    <div class="filters-inner">
      <div class="search-box">
        <span class="search-icon">Buscar</span>
        <input type="search" id="search-input" placeholder="Buscar tacos, mole, margaritas..." autocomplete="off">
      </div>

      <div class="type-filters">
        <button class="filter-chip active" data-type="todos">Todo</button>
        <button class="filter-chip" data-type="tacos">Tacos</button>
        <button class="filter-chip" data-type="antojitos">Antojitos</button>
        <button class="filter-chip" data-type="principales">Principales</button>
        <button class="filter-chip" data-type="bebidas">Bebidas</button>
        <button class="filter-chip" data-type="postres">Postres</button>
        <button class="filter-chip" data-type="experiencias">Experiencias</button>
      </div>

      <div class="view-toggles">
        <button class="view-btn active" data-view="cards" title="Vista tarjetas" id="view-cards">▦</button>
        <button class="view-btn" data-view="list" title="Vista lista" id="view-list">☰</button>
        <button class="view-btn" data-view="map" title="Vista mapa" id="view-map">⌖</button>
      </div>
    </div>
    <div class="results-info" id="results-count"></div>
  </section>

  <section id="lugares-section">
    <main>
      <div id="places-container"></div>
    </main>
  </section>

  <section id="weather-section" style="display:none">
    <main>
      <div id="weather-container">
        <div class="loading"><div class="spinner"></div> Cargando clima de terraza...</div>
      </div>
    </main>
  </section>

  <script src="app.js"></script>
</body>
</html>
